<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Naseem Esam Momen</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #fff0f5,
                #f8e1eb,
                #fdf6f9
            );

            color: #5a4050;
        }

        .profile {
            width: 500px;
            max-width: 90%;
            padding: 50px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.9);

            border: 1px solid #f0c9d9;
            border-radius: 25px;

            box-shadow: 0 15px 35px rgba(180, 100, 135, 0.18);
        }

        .flower {
            font-size: 35px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 10px 0;
            font-size: 34px;
            color: #a65378;
        }

        h2 {
            margin: 15px 0;
            font-size: 23px;
            font-weight: 500;
            color: #c06b91;
        }

        p {
            font-size: 19px;
            color: #765568;
            margin-top: 20px;
        }

        .line {
            width: 80px;
            height: 3px;
            margin: 20px auto;
            background: #d990ae;
            border-radius: 10px;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #a9788e;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="flower">🌸</div>

        <h1>Naseem Esam Momen</h1>

        <div class="line"></div>

        <h2>Cybersecurity</h2>

        <p>Bachelor's Degree</p>

        <div class="footer">
            ✨ Welcome to my personal page ✨
        </div>

    </div>

</body>
</html>
